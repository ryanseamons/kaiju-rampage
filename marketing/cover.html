<!doctype html>
<!-- Voyage Labs cover: key art (cover-art-1.png, from scripts/gen-cover.ts) with the title set in the
     game's poster style. Rendered to cover.png (1600x1000) by scripts/render-cover.ts. The title block
     is centred so a square crop (the middle 1000px) keeps all of it. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root {
    --yellow: #ffd23f; --orange: #ff8a1f; --red: #d7263d; --red-hi: #ff4b5c; --paper: #f3ead2;
    --display: Impact, 'Haettenschweiler', 'Arial Narrow Bold', 'Arial Black', sans-serif;
    --mincho: 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', serif;
    --sans: 'Avenir Next Condensed', 'Avenir Next', 'Helvetica Neue', Arial, sans-serif;
  }
  html, body { margin: 0; width: 1600px; height: 1000px; overflow: hidden; background: #05060d; }
  .art { position: absolute; inset: 0; background: url(cover-art-1.png) center / cover; }
  /* darken the water so the title reads, and a soft vignette */
  .shade {
    position: absolute; inset: 0;
    background:
      linear-gradient(180deg, rgba(5, 6, 13, 0) 52%, rgba(5, 6, 13, 0.55) 70%, rgba(5, 6, 13, 0.92) 100%),
      radial-gradient(ellipse at 50% 45%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.45) 100%);
  }
  .title {
    position: absolute; left: 0; right: 0; top: 680px;
    display: flex; flex-direction: column; align-items: center;
  }
  .logo {
    margin: 0; font-family: var(--display); font-weight: 400; font-size: 138px; line-height: 0.9;
    letter-spacing: 0.02em; transform: skewX(-7deg); white-space: nowrap;
    background: linear-gradient(180deg, #fff6c4 0%, var(--yellow) 28%, var(--orange) 62%, #e0301e 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    -webkit-text-stroke: 4px #1a0508;
    filter: drop-shadow(5px 5px 0 #3a0a0f) drop-shadow(10px 10px 0 #1a0508) drop-shadow(0 0 40px rgba(255, 90, 40, 0.45));
  }
  .sub { display: flex; align-items: center; gap: 30px; margin-top: 22px; }
  .rule { width: 120px; height: 3px; background: linear-gradient(90deg, transparent, var(--red-hi)); }
  .rule.r { background: linear-gradient(90deg, var(--red-hi), transparent); }
  .jp {
    font-family: var(--mincho); font-weight: 800; font-size: 54px; letter-spacing: 0.32em; margin-right: -0.32em;
    color: var(--red-hi); text-shadow: 0 0 24px rgba(215, 38, 61, 0.7), 3px 3px 0 #1a0508;
  }
  .head { position: relative; }
  .seal {
    position: absolute; right: -34px; top: -58px; width: 80px; height: 80px;
    display: grid; place-items: center; background: var(--red); border-radius: 12px;
    font-family: var(--mincho); font-weight: 900; font-size: 56px; color: #fff2ea; line-height: 1;
    box-shadow: inset 0 0 0 6px rgba(255, 255, 255, 0.25), 0 8px 24px rgba(0, 0, 0, 0.6);
    transform: rotate(-8deg);
  }
</style>
</head>
<body>
  <div class="art"></div>
  <div class="shade"></div>
  <div class="title">
    <div class="head"><h1 class="logo">KAIJU RAMPAGE</h1><div class="seal" lang="ja">怪</div></div>
    <div class="sub"><i class="rule"></i><span class="jp" lang="ja">怪獣大暴れ</span><i class="rule r"></i></div>
  </div>
</body>
</html>
